<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marmitas do Leandro | Comida de verdade todo dia</title>
<meta name="description" content="Conheça as marmitas do Leandro: cardápio, ingredientes, tamanhos, preparo, ficha técnica e pedidos pelo WhatsApp.">
<meta property="og:title" content="Marmitas do Leandro">
<meta property="og:description" content="Comida de verdade todo dia. Escolha sua marmita e peça pelo WhatsApp.">
<meta property="og:image" content="https://mpaulo22-svg.github.io/marmitas-do-leandro/img/leandro.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 40%22%3E%3Cpath d=%22M5 30a16 16 0 0 1 32 0%22 fill=%22none%22 stroke=%22%23F2A33A%22 stroke-width=%224%22/%3E%3Crect x=%222%22 y=%2231%22 width=%2238%22 height=%225%22 rx=%222%22 fill=%22%23F2A33A%22/%3E%3C/svg%3E">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Caveat:wght@500;700&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F4EDE3; --surface:#FFFBF5; --surface-2:#EDE3D5; --surface-3:#E3D6C4;
  --ink:#1C1712; --ink-2:#62574C; --ink-3:#8E8274; --line:#E3D5C2;
  --porco:#D27A17; --porco-ink:#9A540A; --porco-soft:#FBE7CC; --on-porco:#1A1208;
  --ouro:#6F9E3F; --ouro-soft:#E3EFD3; --ouro-ink:#3F6620;
  --ok:#2E7D4F; --ok-soft:#DDF0E2; --warn:#A86F0A; --warn-soft:#F8EBCF; --bad:#B63A32; --bad-soft:#F7DFDA;
  --chalk:#151210; --chalk-2:#221C18; --chalk-ink:#F3EBDD; --gold:#F2A33A; --wood:#7A4B2A; --leaf:#7FB24A; --leather:#8B5530;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 10px 26px -12px rgba(40,30,10,.22);
  --radius:14px; --display:"Libre Baskerville",Baskerville,"Times New Roman",Georgia,serif;
  --chalkfont:Caveat,"Segoe Print","Comic Sans MS",cursive;
  --body:Figtree,"Segoe UI",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --hdr:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#110E0C; --surface:#1B1714; --surface-2:#241E1A; --surface-3:#2E2621;
  --ink:#F3EBDD; --ink-2:#BCAE9C; --ink-3:#8A7D6E; --line:#352C26;
  --porco:#F2A33A; --porco-ink:#F6B962; --porco-soft:#3A2710; --on-porco:#1A1208;
  --ouro:#8CC05A; --ouro-soft:#20301A; --ouro-ink:#A9D57C;
  --ok:#62C08A; --ok-soft:#173226; --warn:#E9B551; --warn-soft:#3A2C12; --bad:#EE7C70; --bad-soft:#3C1F1B;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -12px rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#110E0C; --surface:#1B1714; --surface-2:#241E1A; --surface-3:#2E2621;
  --ink:#F3EBDD; --ink-2:#BCAE9C; --ink-3:#8A7D6E; --line:#352C26;
  --porco:#F2A33A; --porco-ink:#F6B962; --porco-soft:#3A2710; --on-porco:#1A1208;
  --ouro:#8CC05A; --ouro-soft:#20301A; --ouro-ink:#A9D57C;
  --ok:#62C08A; --ok-soft:#173226; --warn:#E9B551; --warn-soft:#3A2C12; --bad:#EE7C70; --bad-soft:#3C1F1B;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -12px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--porco);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
@media(min-width:720px){.wrap{padding-inline:28px}}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.hidden{display:none!important}

/* ===== header ===== */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--chalk) 94%,transparent);color:var(--chalk-ink);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid rgba(242,163,58,.3);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.hdr.hide{transform:translateY(-110%)}
.hdr-in{display:flex;align-items:center;gap:18px;height:var(--hdr)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex-shrink:0;background:none;border:0;padding:0}
.brand-mark{width:46px;height:40px;display:grid;place-items:center;color:var(--gold)}
.brand-mark svg{width:46px;height:40px}
.brand-name{font-family:var(--display);font-size:20px;line-height:1;color:var(--chalk-ink);text-align:center}
.brand-name small{display:flex;align-items:center;gap:6px;justify-content:center;font-family:var(--display);font-size:12.5px;font-weight:700;color:var(--gold);margin-top:4px;letter-spacing:.01em}
.brand-name small::before,.brand-name small::after{content:"";width:12px;height:1.5px;background:var(--gold);opacity:.8}
.nav{display:none;gap:2px;margin-left:auto;background:rgba(255,255,255,.06);padding:4px;border-radius:999px;border:1px solid rgba(255,255,255,.08)}
.nav button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:rgba(239,233,219,.72);display:flex;gap:6px;align-items:center;white-space:nowrap}
.nav button:hover{color:var(--chalk-ink)}
.nav button[aria-current="page"]{background:var(--gold);color:#1B1507}
.nav .badge{background:var(--leaf);color:#12200a;font-size:11px;border-radius:999px;padding:0 6px;font-family:var(--mono)}
.hdr-actions{display:flex;gap:8px;margin-left:auto;align-items:center}
@media(min-width:1000px){.nav{display:flex}.hdr-actions{margin-left:10px}}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.hdr .iconbtn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:var(--chalk-ink)}
.hdr .iconbtn .dot{background:var(--gold);color:#1B1507}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--porco);color:var(--on-porco);font:600 11px/19px var(--mono);text-align:center}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* bottom nav (mobile) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;overflow-x:auto;scrollbar-width:none;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.bnav::-webkit-scrollbar{display:none}
.bnav.hide{transform:translateY(110%)}
.bnav button{flex:1 0 64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:11px;font-weight:600;color:var(--ink-3)}
.bnav button[aria-current="page"]{color:var(--porco-ink);background:var(--porco-soft)}
@media(min-width:1000px){.bnav{display:none}body{padding-bottom:0}}

/* ===== generic ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:700;font-size:14px;white-space:nowrap;transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--porco);border-color:var(--porco);color:var(--on-porco)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.gold{background:var(--ouro);border-color:var(--ouro);color:#2A1804}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:18px}
@media(min-width:720px){.pad{padding:22px}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.porco{background:var(--porco-soft);color:var(--porco-ink)}
.chip.ouro{background:var(--ouro-soft);color:var(--ouro-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14.5px;min-width:0}
.input:focus{border-color:var(--porco);outline:none;box-shadow:0 0 0 3px var(--porco-soft)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.section-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.section-h h2{font-family:var(--display);font-size:clamp(21px,2.8vw,28px);line-height:1.1;font-weight:700}
.page{padding-block:22px 40px}
.page-h{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.5vw,44px);line-height:1}
.page-h p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.tablewrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.demo-banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--porco-soft);color:var(--porco-ink);border:1px dashed color-mix(in srgb,var(--porco) 55%,transparent);padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;margin-bottom:18px}
.empty{padding:28px;text-align:center;color:var(--ink-3);font-weight:600}

/* ===== hero ===== */
.hero{position:relative;border-radius:24px;overflow:hidden;margin-top:18px;display:grid;background:radial-gradient(120% 90% at 85% 10%,rgba(242,163,58,.32),transparent 55%),linear-gradient(135deg,#261a12,#120f0d 60%);color:var(--chalk-ink);border:1px solid rgba(242,163,58,.25)}
@media(min-width:900px){.hero{grid-template-columns:1.2fr .8fr;min-height:700px}}
.board{position:relative;margin:clamp(14px,2.4vw,26px);border-radius:16px;padding:clamp(22px,3.4vw,40px);background:radial-gradient(90% 70% at 30% 20%,#2a312b,#171c18 70%);box-shadow:inset 0 0 0 10px #5a3a20,inset 0 0 0 12px #3b2513,inset 0 0 60px rgba(0,0,0,.6),0 20px 40px -18px rgba(0,0,0,.7);display:flex;flex-direction:column;justify-content:center;gap:16px;z-index:2}
.board::after{content:"";position:absolute;inset:12px;border-radius:8px;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px)}
.board .chalk-k{font-family:var(--chalkfont);font-size:clamp(22px,2.6vw,28px);color:rgba(239,233,219,.8);line-height:1}
.board h1{font-family:var(--chalkfont);font-weight:700;font-size:clamp(46px,7vw,82px);line-height:.88;color:#F4EFE3;letter-spacing:.01em;text-shadow:0 0 1px rgba(255,255,255,.4)}
.board h1 em{font-style:normal;color:var(--gold)}
.board .rule{height:2px;width:120px;background:rgba(239,233,219,.55);border-radius:2px;transform:rotate(-1.2deg)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--chalkfont);font-size:clamp(22px,2.4vw,27px);color:#EDE6D5;line-height:1.1}
.checks li{display:flex;gap:10px;align-items:baseline}
.checks li::before{content:"✓";color:var(--leaf);font-weight:700}
.board p{font-family:var(--body);font-size:15px;color:rgba(239,233,219,.78);margin:0;max-width:48ch}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;padding-top:4px}
.hero-stats div{font-size:12px;color:rgba(239,233,219,.65);font-weight:600;letter-spacing:.04em}
.hero-stats b{display:block;font-family:var(--display);font-weight:700;font-size:24px;color:var(--gold);letter-spacing:0}
.hero .btn.primary{background:var(--gold);border-color:var(--gold);color:#1B1507}
.hero .btn.ghostl{background:rgba(255,255,255,.08);color:var(--chalk-ink);border-color:rgba(255,255,255,.22)}
.chef{position:relative;min-height:420px}
.chef>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.chef::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#15120d 0%,rgba(21,18,13,0) 22%),linear-gradient(0deg,rgba(15,12,8,.55),transparent 40%)}
@media(max-width:899px){.chef{min-height:0;aspect-ratio:4/4.2}.chef::after{background:linear-gradient(0deg,#15120d 0%,rgba(21,18,13,0) 30%)}}
.pdia{position:absolute;left:14px;bottom:14px;z-index:3;width:min(200px,46%);background:rgba(20,17,12,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(224,176,78,.35);border-radius:16px;overflow:hidden;color:var(--chalk-ink)}
.pdia .ph{position:relative;aspect-ratio:4/3}
.pdia .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
.pdia .ph img.on{opacity:1}
.pdia .cap{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pdia .cap small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.pdia .cap b{font-size:14px;line-height:1.2}
.hero-dots{display:flex;gap:5px;padding:0 12px 10px}
.hero-dots button{flex:1;height:3px;border-radius:3px;border:0;background:rgba(255,255,255,.25);padding:0}
.hero-dots button.on{background:var(--gold)}

/* strip of lard facts */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:18px 0 8px}
.fact{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.fact .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--porco-soft);color:var(--porco-ink);flex-shrink:0}
.fact b{display:block;font-size:14px}
.fact span{font-size:13px;color:var(--ink-2)}

/* toolbar */
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));z-index:30;background:var(--bg);padding-block:12px;margin-top:10px;transition:top .32s cubic-bezier(.2,.8,.2,1)}
.toolbar.up{top:env(safe-area-inset-top,0px)}
.toolbar-in{display:flex;gap:10px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:0}
.search input{border:0;background:none;padding:11px 0;width:100%;outline:none;min-width:0}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:10px}
.cats::-webkit-scrollbar{display:none}
.cats button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--ink-2)}
.cats button[aria-pressed="true"]{background:var(--porco);color:var(--on-porco);border-color:var(--porco)}

/* rails */
.rail{margin-top:26px}
.rail-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
.rail-h h2{font-family:var(--display);font-weight:700;font-size:clamp(21px,2.6vw,27px);line-height:1.05}
.rail-h .count{font-size:13px;color:var(--ink-3);font-weight:600;margin-left:8px;font-family:var(--body)}
.rail-nav{display:flex;gap:6px}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(250px,74vw,310px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:2px;padding:4px 2px 18px;scrollbar-width:thin;overscroll-behavior-x:contain;cursor:grab}
.track.dragging{cursor:grabbing;scroll-snap-type:none}
.track.dragging *{pointer-events:none}
.dish{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,opacity .5s}
.dish:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.dish.pre{opacity:.35;transform:translateY(14px) scale(.98)}
.dish-media{position:relative;aspect-ratio:4/3;background:var(--surface-3);overflow:hidden;border:0;padding:0;width:100%;display:block}
.dish-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.dish:hover .dish-media img{transform:scale(1.05)}
.dish-media .tag{position:absolute;left:10px;top:10px;background:rgba(21,18,16,.82);border:1px solid rgba(242,163,58,.45);color:#fff;backdrop-filter:blur(6px);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.02em}
.dish-media .kpi{position:absolute;right:10px;top:10px;background:var(--gold);color:#1B1507;font:600 11px var(--mono);padding:4px 8px;border-radius:999px}
.dish-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.dish-body h3{font-size:17px;font-weight:800;line-height:1.2}
.dish-body p{margin:0;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto;padding-top:6px}
.sizes button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .15s,border-color .15s}
.sizes button:hover{border-color:var(--porco);background:var(--porco-soft)}
.sizes button b{font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
.sizes button span{font:600 13.5px var(--mono)}

/* cart bar */
.cartbar{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:44;width:min(560px,calc(100% - 32px));background:var(--chalk);color:var(--chalk-ink);border:1px solid rgba(224,176,78,.35);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
.cartbar.hide{transform:translate(-50%,160%);opacity:0}
.cartbar .t{flex:1;min-width:0;font-weight:700;font-size:14px}
.cartbar .t small{display:block;font-weight:500;opacity:.7;font-size:12px}
@media(min-width:1000px){.cartbar{bottom:22px}}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(18,8,10,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);z-index:61;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-family:var(--display);font-weight:700;font-size:24px}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.drawer-f{border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.line-item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center}
.line-item img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.qty button{border:0;background:none;width:30px;height:30px;display:grid;place-items:center}
.qty span{min-width:24px;text-align:center;font:600 13px var(--mono)}
.sumrow{display:flex;justify-content:space-between;font-size:14px}
.sumrow.total{font-size:18px;font-weight:800}
.modal{position:fixed;inset:0;z-index:62;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal .sheet{pointer-events:auto;width:min(980px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--bg);border-radius:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);display:grid;grid-template-columns:1fr;transform:translateY(20px) scale(.98);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s}
.modal.on .sheet{transform:none;opacity:1}
@media(min-width:860px){.modal .sheet{grid-template-columns:1.15fr 1fr}}
.sheet-media{position:relative;background:#1a1112;min-height:260px}
.sheet-media img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:4/3}
.sheet-media .hd{position:absolute;left:12px;bottom:12px;display:flex;gap:8px}
.sheet-media .hd a{background:rgba(20,10,12,.72);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.sheet-body{padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet-body h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.02}
.sizepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sizepick button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 8px;text-align:center}
.sizepick button[aria-pressed="true"]{border-color:var(--porco);background:var(--porco-soft)}
.sizepick b{display:block;font-size:15px}
.sizepick small{display:block;color:var(--ink-3);font-size:12px}
.sizepick span{display:block;font:600 16px var(--mono);margin-top:4px}
.closex{position:absolute;right:12px;top:12px;z-index:3;width:38px;height:38px;border-radius:999px;border:0;background:rgba(20,10,12,.6);color:#fff;display:grid;place-items:center}
.ings{display:flex;flex-wrap:wrap;gap:6px}

/* toast */
.toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:tin .3s ease}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi-c{padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.kpi-c .l{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.kpi-c .v{font:600 clamp(22px,2.6vw,28px) var(--mono);letter-spacing:-.02em;line-height:1.15}
.kpi-c .s{font-size:12.5px;color:var(--ink-2)}
.kpi-c.hl{background:var(--porco);border-color:var(--porco);color:var(--on-porco)}
.kpi-c.hl .l,.kpi-c.hl .s{color:inherit;opacity:.85}
.split{display:grid;gap:16px}
@media(min-width:960px){.split{grid-template-columns:1.35fr 1fr}.split.even{grid-template-columns:1fr 1fr}.split.side{grid-template-columns:320px 1fr}}

/* pdv */
.pdv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pdv-item{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.pdv-item img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.pdv-item .n{font-size:13px;font-weight:700;padding:8px 10px 4px;line-height:1.2;min-height:40px}
.pdv-item .b{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 8px 8px;margin-top:auto}
.pdv-item .b button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 0;font:600 12px var(--mono)}
.pdv-item .b button:hover{background:var(--porco);color:var(--on-porco);border-color:var(--porco)}
.sizebars{display:flex;flex-direction:column;gap:10px}
.sizebar{display:grid;grid-template-columns:70px 1fr 48px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.sizebar .bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.sizebar .bar i{display:block;height:100%;background:var(--porco);border-radius:6px}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.col-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;padding:2px 4px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.order .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.order .top b{font:600 15px var(--mono)}
.order ul{margin:0;padding-left:18px;color:var(--ink-2)}

/* recipes */
.reclist{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto;padding-right:4px}
.recbtn{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;border:1px solid transparent;background:none;text-align:left;padding:6px;border-radius:12px}
.recbtn img{width:48px;height:48px;border-radius:9px;object-fit:cover}
.recbtn[aria-pressed="true"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.recbtn b{font-size:14px;display:block;line-height:1.2}
.recbtn small{color:var(--ink-3);font-size:12px}
.bigsize{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bigsize button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.bigsize button[aria-pressed="true"]{border-color:var(--porco);background:var(--porco-soft)}
.bigsize .sz{font-family:var(--display);font-size:28px;line-height:1}
.pricebox{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pricebox div{border-radius:14px;padding:14px;background:var(--surface-2)}
.pricebox div.main{background:var(--porco);color:var(--on-porco)}
.pricebox small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.pricebox b{font:600 22px var(--mono)}
.costbar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.costbar i{display:block;height:100%}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis-t{fill:var(--ink-3);font:500 11px var(--mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.bill{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bill:last-child{border-bottom:0}
.bill .d{width:46px;text-align:center;border-radius:10px;background:var(--surface-2);padding:6px 0;line-height:1.1}
.bill .d b{display:block;font-size:17px;font-family:var(--mono)}
.bill .d small{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--ink-3)}
.foot{padding:28px 0 10px;color:var(--ink-3);font-size:12.5px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.hero-slides img{transform:none}}
</style>

function registrarVenda(itensSrc,opts){
  if(S.demo){S.demo=false}
  const k=today();const d=day(k);
  const itens=itensSrc.map(x=>{const c=custo(x.p,x.t);return {p:x.p,t:x.t,q:x.q,preco:c.preco,custo:c.total}});
  const sub=itens.reduce((a,b)=>a+b.preco*b.q,0);const taxa=opts.tipo==='entrega'?G().taxaEntrega:0;const desc=Math.min(sub,+opts.desc||0);
  const now=new Date();const num=(d.vendas.reduce((m,v)=>Math.max(m,v.num||0),0))+1;
  const v={id:uid(),num,ts:now.getTime(),hora:pad(now.getHours())+':'+pad(now.getMinutes()),itens,sub,desc,taxa,total:sub+taxa-desc,custo:itens.reduce((a,b)=>a+b.custo*b.q,0),pag:opts.pag,cliente:opts.cliente||'',fone:opts.fone||'',end:opts.end||'',obs:opts.obs||'',tipo:opts.tipo,status:opts.tipo==='balcao'?'entregue':'recebido'};
  d.vendas.push(v);saveDay(k);return v;
}

const LCATS_D=['Insumos','Embalagens','Gás e energia','Aluguel','Funcionários','Entregas','Impostos','Manutenção','Outros'];
const LCATS_E=['Encomendas','Eventos','Aporte','Outros'];
function fluxoMes(m){
  const ks=diasDoMes(m);const vend=ks.map(k=>[k,resumoVendas(vendasDia(k))]);
  const ls=lancMes(m);
  const entV=vend.reduce((a,[,r])=>a+r.fat,0);
  const entO=ls.filter(l=>l.tipo==='entrada').reduce((a,b)=>a+b.valor,0);
  const saiP=ls.filter(l=>l.tipo==='despesa'&&l.status==='pago').reduce((a,b)=>a+b.valor,0);
  const saiPend=ls.filter(l=>l.tipo==='despesa'&&l.status!=='pago').reduce((a,b)=>a+b.valor,0);
  const g=G();const deducoes=entV*(g.imposto+g.taxa);
  return {vend,ls,entV,entO,ent:entV+entO,saiP,saiPend,saldo:entV+entO-saiP,marmitas:vend.reduce((a,[,r])=>a+r.marmitas,0),custoMarm:vend.reduce((a,[,r])=>a+r.custo,0),deducoes};
}

  const L=S.lanc;
  const lista=f.ls.slice().sort((a,b)=>a.data<b.data?1:-1);
  return `<div class="wrap page">${demoBanner()}<div class="page-h"><div><div class="eyebrow">Fluxo de caixa</div><h1>${monthLabel(m)}</h1><p>Entradas das vendas e de outras receitas, despesas pagas, contas a pagar e o lucro do mês.</p></div>

  <div class="kpis">

   <div class="kpi-c"><span class="l">Saídas pagas</span><span class="v" style="color:var(--bad)">${money(f.saiP)}</span><span class="s">${money(f.saiPend)} ainda a pagar</span></div>
   <div class="kpi-c hl"><span class="l">Saldo do mês</span><span class="v">${money(f.saldo)}</span><span class="s">Entradas − saídas pagas</span></div>
   <div class="kpi-c"><span class="l">Lucro após contas</span><span class="v" style="color:${f.saldo-f.saiPend-f.deducoes>=0?'var(--ok)':'var(--bad)'}">${money(f.saldo-f.saiPend-f.deducoes)}</span><span class="s">Descontando pendências, imposto e cartão</span></div>
  </div>
  <div class="card pad" style="margin-top:16px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="eyebrow">Movimento diário</div><div class="legend"><span><i style="background:var(--ok)"></i>Entradas</span><span><i style="background:var(--bad)"></i>Saídas</span><span><i style="background:var(--ouro)"></i>Saldo acumulado (eixo direito)</span></div></div>
   <div class="chart">${chartFlow(byDay)}</div></div>

    ${lista.map(l=>`<tr><td class="num">${fmtDate(l.data).slice(0,5)}</td><td>${esc(l.desc)}</td><td class="muted">${esc(l.cat)}</td><td>${l.tipo==='entrada'?'<span class="chip ok">recebido</span>':l.status==='pago'?'<span class="chip">pago</span>':`<span class="chip ${l.data<hoje?'bad':'warn'}">${l.data<hoje?'vencida':'a pagar'}</span>`}</td><td class="r num" style="color:${l.tipo==='entrada'?'var(--ok)':'inherit'}">${l.tipo==='entrada'?'+':'−'} ${money(l.valor)}</td><td class="r">${S.confirmDel===l.id?`<span class="row" style="gap:4px;justify-content:end"><button class="btn sm danger" data-del="${l.id}" data-m="${m}">Apagar</button><button class="btn sm ghost" data-act="cancel-del">Manter</button></span>`:`<button class="btn sm ghost" data-askdel="${l.id}" aria-label="Apagar lançamento">${ico('trash')}</button>`}</td></tr>`).join('')}

function chartFlow(rows){
  const W=760,H=240,ml=52,mr=52,mt=12,mb=26,iw=W-ml-mr,ih=H-mt-mb;
  const mx=Math.max(1,...rows.map(r=>Math.max(r.a,r.b)));const cs=rows.map(r=>r.c);const cmin=Math.min(0,...cs),cmax=Math.max(1,...cs);
  const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p};
  const step=nice(mx/4),top=Math.ceil(mx/step)*step;const y=v=>mt+ih-(v/top)*ih;
  const cstep=nice(((cmax-cmin)||1)/4),clo=Math.floor(cmin/cstep)*cstep,chi=Math.ceil(cmax/cstep)*cstep;
  const yc=v=>mt+ih-((v-clo)/((chi-clo)||1))*ih;
  const bw=iw/rows.length;const ticks=[];for(let t=0;t<=top+1e-6;t+=step)ticks.push(t);
  const kf=t=>Math.abs(t)>=1000?(t/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':String(Math.round(t));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por dia">`;
  ticks.forEach(t=>{s+=`<line class="grid-l" x1="${ml}" x2="${W-mr}" y1="${y(t)}" y2="${y(t)}"/><text class="axis-t" x="${ml-6}" y="${y(t)+4}" text-anchor="end">${kf(t)}</text>`});
  for(let t=clo;t<=chi+1e-6;t+=cstep)s+=`<text x="${W-mr+6}" y="${yc(t)+4}" style="fill:var(--ouro-ink);font:500 11px var(--mono)">${kf(t)}</text>`;
  rows.forEach((r,i)=>{const x=ml+i*bw;const w=Math.max(2,bw/2-2);
    if(r.a)s+=`<rect x="${x+bw/2-w-1}" y="${y(r.a)}" width="${w}" height="${mt+ih-y(r.a)}" rx="2" fill="var(--ok)" opacity="${r.future?.3:.9}"><title>Dia ${r.l}: entradas ${money(r.a)}</title></rect>`;
    if(r.b)s+=`<rect x="${x+bw/2+1}" y="${y(r.b)}" width="${w}" height="${mt+ih-y(r.b)}" rx="2" fill="var(--bad)" opacity=".85"><title>Dia ${r.l}: saídas ${money(r.b)}</title></rect>`;
    if(i%Math.ceil(rows.length/15)===0||i===rows.length-1)s+=`<text class="axis-t" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${r.l}</text>`});
  const pts=rows.filter(r=>!r.future).map((r,i)=>`${ml+i*bw+bw/2},${yc(r.c)}`);
  if(pts.length>1){s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(--ouro)" stroke-width="2.5" stroke-linejoin="round"/>`;const lp=pts[pts.length-1].split(',');s+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" fill="var(--ouro)" stroke="var(--surface)" stroke-width="2"/>`}
  return s+'</svg>';
}

function setupRails(){
  const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('pre');io.unobserve(e.target)}}),{rootMargin:'0px 0px -20px 0px',threshold:.15}):null;
  $$('.dish').forEach(d=>io?io.observe(d):d.classList.remove('pre'));
  setTimeout(()=>$$('.dish.pre').forEach(d=>{const r=d.getBoundingClientRect();if(r.top<innerHeight&&r.left<innerWidth)d.classList.remove('pre')}),50);
  $$('.track').forEach(t=>{let down=false,sx=0,sl=0,moved=0;
    t.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=0;sx=e.clientX;sl=t.scrollLeft});
    t.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>4){moved=dx;t.classList.add('dragging')}t.scrollLeft=sl-dx});
    const up=()=>{if(!down)return;down=false;setTimeout(()=>t.classList.remove('dragging'),0)};
    t.addEventListener('pointerup',up);t.addEventListener('pointerleave',up);
    t.addEventListener('click',e=>{if(Math.abs(moved)>4){e.stopPropagation();e.preventDefault();moved=0}},true)});
}

      db.collection('lancamentos').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=clone(d.data()));
        if(!got.meses&&!s.docs.length&&Object.keys(DATA.meses).length){for(const k of Object.keys(DATA.meses))saveMonth(k)} else DATA.meses=o; got.meses=true; lsSave(); rerender()},()=>{});
      db.doc('config/app').onSnapshot(s=>{if(s.exists){const d=clone(s.data());DATA.cfg=Object.assign({precos:{},geral:clone(DEFAULT_GERAL),fotos:{},praticado:{}},d);lsSave();rerender()}},()=>{});
    }).catch(()=>{});
  }
})();
</script>
